version: 2

project_name: readscope

builds:
  - id: readscope
    main: ./cmd/readscope
    binary: readscope
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

release:
  draft: false
  footer: >-
    ReadScope runs inside a Linux container (Docker or any runtime with
    /dev/fuse); the darwin and windows binaries build from the same tree but
    need a container for the facade — see the README quickstart.
