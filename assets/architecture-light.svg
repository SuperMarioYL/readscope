<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="ReadScope architecture" data-palette="7de656-6ae78b-dbf6ac-447cdb53bf04">
  <style>
    text { font-family: -apple-system,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif; }
    .mono { font-family: 'SF Mono','JetBrains Mono','Cascadia Code',ui-monospace,Menlo,Consolas,monospace; }
    .drift1 { animation: drift1 9s ease-in-out infinite alternate; }
    .drift2 { animation: drift2 9s ease-in-out infinite alternate; }
    .pulse  { animation: pulse 3s ease-in-out infinite; }
    .pulse2 { animation: pulse2 3s ease-in-out infinite; }
    .flow   { stroke-dasharray: 6 8; animation: march 1.6s linear infinite; }
    .flow-slow { stroke-dasharray: 5 9; animation: march 3.2s linear infinite; }
    .blink  { animation: blink 2.4s steps(2, jump-none) infinite; }
    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(14px,-18px); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-12px,16px); } }
    @keyframes pulse  { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes pulse2 { 0%,100% { opacity: .9; } 45% { opacity: .25; } }
    @keyframes march  { to { stroke-dashoffset: -28; } }
    @keyframes blink  { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      .drift1,.drift2,.pulse,.pulse2,.flow,.flow-slow,.blink { animation: none; }
    }</style>
  <rect width="1200" height="660" fill="#fafef9"/>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="halo" cx="50%" cy="42%" r="55%">
    <stop offset="0%" stop-color="#468231" stop-opacity="0.16"/>
    <stop offset="60%" stop-color="#3c824f" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#fafef9" stop-opacity="0"/>
  </radialGradient>
  <g><line x1="60" y1="0" x2="60" y2="660" stroke="#d7f7cb" stroke-width="0.5" opacity="0.5"/>
<line x1="180" y1="0" x2="180" y2="660" stroke="#d7f7cb" stroke-width="0.5" opacity="0.5"/>
