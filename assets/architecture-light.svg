<line x1="0" y1="60" x2="1200" y2="60" stroke="#d7f7cb" stroke-width="0.5" opacity="0.5"/>
<line x1="0" y1="180" x2="1200" y2="180" stroke="#d7f7cb" stroke-width="0.5" opacity="0.5"/>
