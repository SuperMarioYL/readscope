    <stop offset="60%" stop-color="#3c824f" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#fafef9" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="640" fill="url(#halo)"/>
