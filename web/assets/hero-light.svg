  <text x="600" y="526" text-anchor="middle" font-size="20" fill="#182a1c">把仓库交给 Coding Agent 之前，先交给它一个默认拒绝的视图</text>
  <text x="600" y="556" text-anchor="middle" font-size="16" fill="#5d7a6b" class="mono">default-deny workspace view · JIT read grants · per-run exposure manifest</text>

