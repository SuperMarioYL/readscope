  <!-- workspace shield: the default-deny projection -->
  <g filter="url(#glow)">
    <path d="M 600 150 L 728 202 L 728 320 Q 728 364 600 390 Q 472 364 472 320 L 472 202 Z"
      fill="#f9fef7" stroke="#468231" stroke-width="2.5"/>
  </g>
  <text x="600" y="190" text-anchor="middle" font-size="15" letter-spacing="4" fill="#5d7a6b">/workspace · 默认拒绝视图</text>

  <!-- file rows: pass / deny / pass -->
  <g class="mono" font-size="17">
    <rect x="508" y="214" width="184" height="34" rx="6" fill="#f6fdf3" stroke="#3c824f" stroke-width="1"/>
