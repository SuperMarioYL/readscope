name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install fuse (the facade integration tests mount for real)
        run: sudo apt-get update && sudo apt-get install -y fuse
      - run: go build ./...
      - run: go vet ./...
      - name: Build the release targets (catches a .goreleaser.yaml goos that cannot compile)
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -o /dev/null ./cmd/readscope
          done
      - run: go test ./...
